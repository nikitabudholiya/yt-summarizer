<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Summarizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #0f0f0f;
      color: #f1f1f1;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #272727;
      background: #181818;
    }
    .logo {
      width: 28px; height: 28px;
      background: #ff0000;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 14px; fill: #fff; }
    .header h1 { font-size: 15px; font-weight: 600; color: #f1f1f1; }
    .header-sub { font-size: 11px; color: #aaa; margin-top: 1px; }

    .gear-btn {
      margin-left: auto;
      background: none; border: none; cursor: pointer;
      color: #aaa; font-size: 18px; padding: 4px;
      border-radius: 4px; transition: color .15s;
    }
    .gear-btn:hover { color: #f1f1f1; }

    /* ── Body ── */
    .body { padding: 14px 16px; }

    /* ── Settings panel ── */
    .settings-panel {
      display: none;
      padding: 12px 16px;
      background: #181818;
      border-bottom: 1px solid #272727;
    }
    .settings-panel.open { display: block; }
    .settings-panel label { font-size: 12px; color: #aaa; display: block; margin-bottom: 5px; }
    .settings-panel input {
      width: 100%; background: #0f0f0f; border: 1px solid #3a3a3a;
      color: #f1f1f1; padding: 7px 10px; border-radius: 6px;
      font-size: 13px; outline: none;
    }
    .settings-panel input:focus { border-color: #ff0000; }
    .settings-save {
      margin-top: 8px; padding: 6px 14px; background: #ff0000;
      color: #fff; border: none; border-radius: 6px; font-size: 12px;
      cursor: pointer; font-weight: 500;
    }
    .settings-save:hover { background: #cc0000; }

    /* ── URL row ── */
    .url-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .url-row input {
      flex: 1; background: #272727; border: 1px solid #3a3a3a;
      color: #f1f1f1; padding: 8px 11px; border-radius: 8px;
      font-size: 13px; outline: none;
    }
    .url-row input::placeholder { color: #666; }
    .url-row input:focus { border-color: #ff0000; }

    /* ── Badges ── */
    .badge-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; padding: 3px 9px; border-radius: 20px;
      border: 1px solid #3a3a3a; color: #aaa; cursor: pointer;
      transition: all .15s;
    }
    .badge:hover, .badge.active { background: #ff0000; border-color: #ff0000; color: #fff; }

    /* ── Buttons ── */
    .btn {
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; transition: all .15s;
    }
    .btn-primary { background: #ff0000; color: #fff; width: 100%; }
    .btn-primary:hover { background: #cc0000; }
    .btn-primary:disabled { background: #3a3a3a; color: #666; cursor: not-allowed; }

    /* ── Loader ── */
    .loader {
      display: none; text-align: center; padding: 20px 0; color: #aaa;
    }
    .loader.show { display: block; }
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid #3a3a3a; border-top-color: #ff0000;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { font-size: 12px; }

    /* ── Result card ── */
    .result-card {
      display: none;
      background: #181818; border: 1px solid #272727;
      border-radius: 10px; overflow: hidden;
    }
    .result-card.show { display: block; }

    .result-tabs {
      display: flex; border-bottom: 1px solid #272727;
    }
    .tab-btn {
      flex: 1; padding: 9px 0; font-size: 12px; font-weight: 600;
      background: none; border: none; color: #aaa; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab-btn.active { color: #ff0000; border-bottom-color: #ff0000; }

    .tab-pane { display: none; padding: 14px; }
    .tab-pane.active { display: block; }

    .result-text {
      font-size: 13px; line-height: 1.7; color: #d4d4d4;
      max-height: 280px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #3a3a3a #0f0f0f;
    }

    /* ── Q&A ── */
    .qa-input-row { display: flex; gap: 7px; margin-top: 10px; }
    .qa-input-row input {
      flex: 1; background: #272727; border: 1px solid #3a3a3a;
      color: #f1f1f1; padding: 8px 11px; border-radius: 8px;
      font-size: 13px; outline: none;
    }
    .qa-input-row input:focus { border-color: #ff0000; }
    .qa-input-row button {
      background: #ff0000; color: #fff; border: none; border-radius: 8px;
      padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .qa-input-row button:hover { background: #cc0000; }

    .qa-messages { max-height: 240px; overflow-y: auto; scrollbar-width: thin; }
    .qa-bubble {
      margin-bottom: 10px; padding: 9px 12px; border-radius: 8px;
      font-size: 13px; line-height: 1.6;
    }
    .qa-bubble.user { background: #272727; color: #f1f1f1; }
    .qa-bubble.ai   { background: #1a1a2e; color: #d4d4d4; }
    .qa-label { font-size: 10px; font-weight: 700; margin-bottom: 4px; color: #888; letter-spacing: .05em; text-transform: uppercase; }

    /* ── Error ── */
    .error-msg {
      display: none; background: #2a1010; border: 1px solid #5a1010;
      color: #f87171; border-radius: 8px; padding: 10px 12px;
      font-size: 12px; margin-top: 10px;
    }
    .error-msg.show { display: block; }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px; font-size: 10px; color: #555;
      border-top: 1px solid #1f1f1f; text-align: right;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M9.5 7.5v9l7-4.5z"/></svg>
  </div>
  <div>
    <h1>YT Summarizer</h1>
    <div class="header-sub">Powered by Groq · LangChain</div>
  </div>
  <button class="gear-btn" id="gearBtn" title="Settings">⚙</button>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settingsPanel">
  <label for="apiKeyInput">Groq API Key</label>
  <input type="password" id="apiKeyInput" placeholder="gsk_…" />
  <label for="serverInput" style="margin-top:10px;">Backend URL</label>
  <input type="text" id="serverInput" placeholder="http://localhost:8000" />
  <button class="settings-save" id="saveSettings">Save</button>
</div>

<!-- Main body -->
<div class="body">
  <!-- URL input + detect button -->
  <div class="url-row">
    <input type="text" id="urlInput" placeholder="Paste YouTube URL or auto-detect ↓" />
  </div>

  <!-- Quick actions -->
  <div class="badge-row">
    <span class="badge" id="detectBtn">📺 Use current tab</span>
    <span class="badge" id="clearBtn">✕ Clear</span>
  </div>

  <!-- Summarize button -->
  <button class="btn btn-primary" id="summarizeBtn" disabled>Summarize Video</button>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>
</div>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <p id="loaderMsg">Fetching transcript…</p>
</div>

<!-- Result card -->
<div class="result-card" id="resultCard">
  <div class="result-tabs">
    <button class="tab-btn active" data-tab="summary">Summary</button>
    <button class="tab-btn" data-tab="qa">Ask a Question</button>
  </div>

  <!-- Summary tab -->
  <div class="tab-pane active" id="tab-summary">
    <div class="result-text" id="summaryText"></div>
  </div>

  <!-- Q&A tab -->
  <div class="tab-pane" id="tab-qa">
    <div class="qa-messages" id="qaMessages"></div>
    <div class="qa-input-row">
      <input type="text" id="qaInput" placeholder="Ask something about the video…" />
      <button id="askBtn">Ask</button>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  Backend must be running at localhost:8000
</div>

<script src="popup.js"></script>
</body>
</html>
